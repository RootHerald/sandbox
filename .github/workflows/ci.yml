name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "@rootherald/node is pinned exactly, and the lock resolves the pin"
        run: |
          set -euo pipefail
          test "$(jq '.dependencies | length' backend/package.json)" = 1
          pin=$(jq -r '.dependencies["@rootherald/node"]' backend/package.json)
          lock=$(jq -r '.packages["node_modules/@rootherald/node"].version' backend/package-lock.json)
          echo "pin=$pin lock=$lock"
          [[ "$pin" =~ ^[0-9] ]]
          test "$pin" = "$lock"

      - name: backend/ holds only its own files
        run: |
          set -euo pipefail
          actual=$(git ls-files backend | LC_ALL=C sort | tr '\n' ' ')
          expected="backend/Dockerfile backend/index.html backend/package-lock.json backend/package.json backend/server.js backend/server.test.js backend/stub-rootherald.js "
          echo "$actual"
          test "$actual" = "$expected"

      - name: No node:crypto signature or encryption code in backend/
        run: |
          set -euo pipefail
          test -s backend/server.js
          if grep -rnE "node:crypto|from ['\"]crypto['\"]|require\(['\"]crypto" backend/ --exclude-dir=node_modules; then echo "::error::forbidden match"; exit 1; fi
          if grep -nE "subtle|createSign|createVerify|createCipheriv|publicEncrypt" backend/server.js; then echo "::error::forbidden match"; exit 1; fi

      - name: The page writes no HTML from data
        run: |
          set -euo pipefail
          test -s backend/index.html
          if grep -nE "innerHTML|outerHTML|insertAdjacentHTML|document\.write" backend/index.html; then echo "::error::forbidden match"; exit 1; fi

      - name: .env is ignored and .env.example holds a placeholder only
        run: |
          set -euo pipefail
          git check-ignore -q .env
          git check-ignore -q backend/node_modules/
          test "$(wc -l < .env.example)" -eq 3
          test "$(grep -c '=$' .env.example)" -eq 1
          grep -qx 'ROOTHERALD_SECRET_KEY=' .env.example
          grep -qx 'SANDBOX_PORT=47823' .env.example
          grep -qx 'ROOTHERALD_URL=https://rootherald.io' .env.example
          test -z "$(git ls-files .env)"

      - name: The README carries the run steps, the route table and the troubleshooting line
        run: |
          set -euo pipefail
          grep -qF 'cp .env.example .env' README.md
          grep -qF 'docker compose up' README.md
          grep -qF 'http://localhost:47823/' README.md
          for route in /enroll/begin /enroll/complete /attest/challenge /attest/verify \
                       /sign/challenge /sign/certify /sign/verify \
                       /decrypt/challenge /decrypt/certify /decrypt/verify; do
            grep -qE "^\|.*POST ${route}\b" README.md || { echo "route table lacks $route"; exit 1; }
          done
          grep -qF 'RootHerald refused: ' README.md
          grep -qF 'If Docker says the port is already allocated, set `SANDBOX_PORT` in `.env` to a free port.' README.md
          if grep -qF 'Admit as unverified' README.md; then echo "::error::forbidden match"; exit 1; fi

      - run: npm ci --prefix backend

      - name: Backend against a stub of the RootHerald API
        run: node --test backend/server.test.js

  compose:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Compose config is loopback-only, unnamed, and defaulted, and only the container listens beyond loopback
        run: |
          set -euo pipefail
          rm -f .env
          docker compose config --format json > /tmp/compose.json
          jq -e '.name == "rootherald-sandbox"' /tmp/compose.json
          jq -e '[.services[] | has("container_name")] | any | not' /tmp/compose.json
          jq -e '[.services[].ports[]? | .host_ip == "127.0.0.1"] | (length > 0 and all)' /tmp/compose.json
          jq -e '.services.backend.ports[0].published == "47823"' /tmp/compose.json
          jq -e '.services.backend.environment.ROOTHERALD_URL == "https://rootherald.io"' /tmp/compose.json
          jq -e '.services.backend.environment.SANDBOX_PORT == "47823"' /tmp/compose.json
          jq -e '.services.backend.environment.SANDBOX_LISTEN == "0.0.0.0"' /tmp/compose.json
          jq -e '[(.volumes // {})[] | (.external // false) == false and (.name | startswith("rootherald-sandbox_"))] | all' /tmp/compose.json
          SANDBOX_PORT=48111 docker compose config --format json \
            | jq -e '.services.backend.ports[0].published == "48111" and .services.backend.ports[0].host_ip == "127.0.0.1"'

      - name: The key is in no image layer, and /app holds only what runs
        run: |
          set -euo pipefail
          canary="rh_sk_cicanary$(openssl rand -hex 16)"
          echo "::add-mask::$canary"
          echo "CANARY=$canary" >> "$GITHUB_ENV"
          printf 'ROOTHERALD_SECRET_KEY=%s\n' "$canary" > .env
          docker compose build
          img=$(docker compose config --images backend)
          echo "IMAGE=$img" >> "$GITHUB_ENV"
          hits=$(docker save "$img" | grep -caF "$canary" || true)
          test "$hits" = 0
          if docker history --no-trunc "$img" | grep -qF "$canary"; then echo "::error::forbidden match"; exit 1; fi
          app=$(docker run --rm --entrypoint ls "$img" -A /app | LC_ALL=C sort | tr '\n' ' ')
          echo "/app: $app"
          test "$app" = "index.html node_modules package-lock.json package.json server.js "

      - name: Coexists with other Docker work, and down -v removes only its own
        run: |
          set -euo pipefail
          docker network create rh-decoy-net
          docker volume create rh-decoy-vol
          docker run -d --name rh-decoy-ctr --network rh-decoy-net -v rh-decoy-vol:/data busybox sleep 900

          python3 -m http.server 47823 --bind 127.0.0.1 >/dev/null 2>&1 &
          listener=$!
          sleep 1
          if docker compose up -d --wait; then echo "up succeeded on a taken port"; exit 1; fi
          kill "$listener"
          docker compose down

          export ROOTHERALD_URL=http://127.0.0.1:9
          docker compose up -d --wait
          for _ in $(seq 30); do
            curl -fs -o /dev/null -H 'Host: localhost:47823' http://127.0.0.1:47823/ && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: localhost:47823' http://127.0.0.1:47823/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.test:47823' http://127.0.0.1:47823/)" = 403
          out=$(curl -s -w '\n%{http_code}' -X POST -H 'Host: localhost:47823' -H 'Content-Type: application/json' \
                  -d '{}' http://127.0.0.1:47823/attest/challenge)
          echo "$out"
          test "$(tail -n1 <<<"$out")" = 502
          grep -qF NETWORK_ERROR <<<"$out"
          if grep -qF "$CANARY" <<<"$out"; then echo "::error::forbidden match"; exit 1; fi

          pin=$(jq -r '.dependencies["@rootherald/node"]' backend/package.json)
          docker compose logs backend > /tmp/backend.log
          grep -qF "@rootherald/node $pin" /tmp/backend.log
          if grep -qF "$CANARY" /tmp/backend.log; then echo "::error::forbidden match"; exit 1; fi

          docker compose down
          SANDBOX_PORT=48111 docker compose up -d --wait
          for _ in $(seq 30); do
            curl -fs -o /dev/null -H 'Host: localhost:48111' http://127.0.0.1:48111/ && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: localhost:48111' http://127.0.0.1:48111/)" = 200
          SANDBOX_PORT=48111 docker compose down -v

          docker compose up -d --wait
          docker compose down -v
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=rootherald-sandbox)"
          test -z "$(docker ps -a --format '{{.Names}}' | grep '^rootherald-sandbox' || true)"
          test -z "$(docker network ls --format '{{.Name}}' | grep '^rootherald-sandbox' || true)"
          test -z "$(docker volume ls --format '{{.Name}}' | grep '^rootherald-sandbox' || true)"
          docker inspect rh-decoy-ctr > /dev/null
          docker network inspect rh-decoy-net > /dev/null
          docker volume inspect rh-decoy-vol > /dev/null

  sdk-checksums:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: sdk/ matches sdk/SHA256SUMS, and each archive's own SHA256SUMS verifies without listing itself
        run: |
          set -euo pipefail
          test -s sdk/SHA256SUMS || { echo "::error::sdk/SHA256SUMS is missing"; exit 1; }
          cd sdk
          sha256sum -c --strict --quiet SHA256SUMS
          listed=$(awk '{print $2}' SHA256SUMS | sed 's|^\*||; s|^\./||' | LC_ALL=C sort)
          present=$(find . -type f ! -path ./SHA256SUMS | sed 's|^\./||' | LC_ALL=C sort)
          if ! diff <(echo "$listed") <(echo "$present"); then echo "::error::sdk/ and sdk/SHA256SUMS list different files"; exit 1; fi
          for os in windows-x64 linux-x64; do
            (
              cd "$os"
              sha256sum -c --strict --quiet SHA256SUMS
              if grep -q 'SHA256SUMS$' SHA256SUMS; then echo "::error::sdk/$os/SHA256SUMS lists itself"; exit 1; fi
            )
          done

      - name: sdk/ holds the two archives at ABI 8.1 and no SDK source
        run: |
          set -euo pipefail
          for f in windows-x64/lib/RootHerald.lib windows-x64/lib/RootHeraldd.lib windows-x64/lib/cmake/RootHerald/RootHeraldConfig.cmake \
                   linux-x64/lib/librootherald.a linux-x64/lib/cmake/RootHerald/RootHeraldConfig.cmake; do
            test -f "sdk/$f" || { echo "::error::sdk/$f is missing"; exit 1; }
          done
          if find sdk \( -name '*.c' -o -name '*.cpp' -o -name CMakeLists.txt -o -type d -name src \) | grep .; then
            echo "::error::sdk/ holds SDK source"; exit 1
          fi
          diff --strip-trailing-cr sdk/windows-x64/include/rootherald.h sdk/linux-x64/include/rootherald.h
          grep -qE '^#define ROOTHERALD_ABI_VERSION_MAJOR 8$' sdk/linux-x64/include/rootherald.h
          grep -qE '^#define ROOTHERALD_ABI_VERSION_MINOR 1$' sdk/linux-x64/include/rootherald.h

      - name: The tree stays within the repository layout, and the client's build output and state are ignored
        run: |
          set -euo pipefail
          git check-ignore -q client/out/x
          git check-ignore -q client/state/x
          layout='LICENSE|README\.md|\.gitignore|\.gitattributes|\.env\.example|compose\.yaml|\.github/workflows/ci\.yml|backend/[^/]+|client/(main\.c|platform\.h|platform_windows\.c|platform_linux\.c|CMakeLists\.txt|CMakePresets\.json|Dockerfile)|sdk/.+'
          if git ls-files | grep -vxE "$layout"; then echo "::error::files outside the repository layout"; exit 1; fi

  client-build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Visual Studio 2022 is installed
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -version "[17,18)" -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio 2022 with the C++ tools" }

      - name: The README's Windows commands are the three this job runs
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          awk '/^#+ Run the client on Windows[[:space:]]*$/ { heading = 1; next }
               heading && !fence && /^#/ { exit }
               heading && /^```/ { if (fence) exit; fence = 1; next }
               fence { print }' README.md | tr -d '\r' | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/windows-block.txt"
          cat "$RUNNER_TEMP/windows-block.txt"
          printf '%s\n' 'cmake --preset windows' 'cmake --build --preset windows' '.\out\build\windows\Debug\sandbox-client.exe' > "$RUNNER_TEMP/windows-expected.txt"
          if ! diff "$RUNNER_TEMP/windows-expected.txt" "$RUNNER_TEMP/windows-block.txt"; then
            echo "::error::README.md has no 'Run the client on Windows' block with the three commands"; exit 1
          fi

      - name: CMakeLists.txt names no SDK file, library, include path or runtime setting
        shell: bash
        run: |
          set -euo pipefail
          test -s CMakeLists.txt
          if grep -nEi 'sdk/|include_directories|link_directories|tss2|crypto|\btbs\b|bcrypt|\.lib\b|\.a\b|MSVC_RUNTIME|/MD' CMakeLists.txt; then
            echo "::error::CMakeLists.txt names the SDK's internals"; exit 1
          fi

      - name: The README's configure and build, with every compiler and linker warning an error
        run: |
          cmake --preset windows -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_EXE_LINKER_FLAGS=/WX
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build --preset windows
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          if (-not (Select-String -Quiet -SimpleMatch 'RootHeraldd.lib' -Path out\build\windows\sandbox-client.vcxproj)) {
            throw "the Debug build does not link RootHeraldd.lib"
          }

      - name: The banner prints first, SANDBOX_URL is honoured, and an unreachable backend exits 1
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:SANDBOX_URL = 'http://127.0.0.1:9'
          $out = @(.\out\build\windows\Debug\sandbox-client.exe | ForEach-Object { "$_" })
          $code = $LASTEXITCODE
          $out | Write-Output
          if ($code -ne 1) { throw "exit $code, expected 1" }
          if ($out[0] -notmatch '^RootHerald SDK: ABI 8\.1, library (\S+)$') { throw "first line is not the SDK banner: $($out[0])" }
          if ($Matches[1] -like 'stub-*') { throw "the client links the stub library" }
          if ($out[1] -ne 'Backend: http://127.0.0.1:9') { throw "second line: $($out[1])" }
          if ($out[2] -notmatch '^State: .*client[/\\]state$') { throw "third line: $($out[2])" }
          if ($out -match '^stopped at ') { throw "an unreachable backend is not a stop by the backend" }

          Remove-Item Env:SANDBOX_URL
          $out = @(.\out\build\windows\Debug\sandbox-client.exe | ForEach-Object { "$_" })
          $out | Write-Output
          $port = (Select-String -Path ..\compose.yaml -Pattern 'SANDBOX_PORT:-(\d+)').Matches[0].Groups[1].Value
          if ($out[1] -ne "Backend: http://127.0.0.1:$port") { throw "default backend: $($out[1]), compose.yaml defaults to $port" }
          if (Test-Path state\ak.blob) { throw "a failed run left state\ak.blob" }
          exit 0

  client-build-linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: The README's Linux commands are the ones this job and the client image run
        working-directory: .
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          # Every fenced line under the heading, with backslash continuations joined.
          awk '/^#+ Run the client on Linux[[:space:]]*$/ { heading = 1; next }
               heading && !fence && /^#/ { exit }
               heading && /^```/ { fence = !fence; next }
               fence { print }' README.md | tr -d '\r' \
            | sed -e ':a' -e '/\\$/{N; s/\\\n[[:space:]]*/ /; ta}' | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/linux-block.txt"
          cat "$RUNNER_TEMP/linux-block.txt"
          test -s "$RUNNER_TEMP/linux-block.txt" || fail "README.md has no 'Run the client on Linux' commands"

          test "$(grep -cE '^sudo apt(-get)? install ' "$RUNNER_TEMP/linux-block.txt")" = 1 || fail "the Linux commands hold no single apt install line"
          packages=$(grep -E '^sudo apt(-get)? install ' "$RUNNER_TEMP/linux-block.txt" | sed -E 's/^sudo apt(-get)? install //' | tr ' ' '\n' | grep -v '^-' | LC_ALL=C sort)
          for package in build-essential cmake pkg-config libtss2-dev libssl-dev libcurl4-openssl-dev; do
            grep -qx "$package" <<<"$packages" || fail "the README's apt line lacks $package"
          done
          echo "$packages" > "$RUNNER_TEMP/readme-packages.txt"

          grep -qx 'sudo usermod -aG tss \$USER' "$RUNNER_TEMP/linux-block.txt" || fail "no tss group line"
          test "$(grep -c 'usermod -aG tss' README.md)" = 1 || fail "the tss group line is not in the README exactly once"
          grep -qF 'z /sys/kernel/security/tpm0/binary_bios_measurements 0440 root tss -' "$RUNNER_TEMP/linux-block.txt" || fail "no event-log tmpfiles rule"

          grep -xE 'cmake --preset linux|cmake --build --preset linux|\./out/build/linux/sandbox-client' "$RUNNER_TEMP/linux-block.txt" > "$RUNNER_TEMP/linux-run.txt" || true
          printf '%s\n' 'cmake --preset linux' 'cmake --build --preset linux' './out/build/linux/sandbox-client' > "$RUNNER_TEMP/linux-run-expected.txt"
          diff "$RUNNER_TEMP/linux-run-expected.txt" "$RUNNER_TEMP/linux-run.txt" || fail "the Linux commands do not configure, build and run with the linux preset, in that order"

      - name: "C21 the client image builds with the README's Linux commands and copies files by name"
        working-directory: .
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          test -s client/Dockerfile || fail "client/Dockerfile is missing"
          # One RUN command per line: continuations joined, && split.
          tr -d '\r' < client/Dockerfile | sed -e ':a' -e '/\\$/{N; s/\\\n[[:space:]]*/ /; ta}' \
            | sed -nE 's/^RUN[[:space:]]+//p' | sed -E 's/[[:space:]]*&&[[:space:]]*/\n/g' \
            | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/[[:space:]]+/ /g' > "$RUNNER_TEMP/docker-run.txt"
          cat "$RUNNER_TEMP/docker-run.txt"

          grep -E '(^|[ =])apt(-get)? install ' "$RUNNER_TEMP/docker-run.txt" | sed -E 's/.*apt(-get)? install //' \
            | tr ' ' '\n' | grep -v '^-' | sed '/^$/d' | LC_ALL=C sort -u > "$RUNNER_TEMP/docker-packages.txt"
          (cat "$RUNNER_TEMP/readme-packages.txt"; printf '%s\n' swtpm swtpm-tools) | LC_ALL=C sort -u > "$RUNNER_TEMP/docker-packages-expected.txt"
          diff "$RUNNER_TEMP/docker-packages-expected.txt" "$RUNNER_TEMP/docker-packages.txt" || fail "the image's packages are not the README's apt line plus swtpm swtpm-tools"

          grep -vE '(^|[ =])apt(-get)? |^rm -rf /var/lib/apt/lists/\*$' "$RUNNER_TEMP/docker-run.txt" > "$RUNNER_TEMP/docker-build.txt" || true
          grep -E '^cmake ' "$RUNNER_TEMP/linux-run.txt" > "$RUNNER_TEMP/readme-build.txt"
          diff "$RUNNER_TEMP/readme-build.txt" "$RUNNER_TEMP/docker-build.txt" || fail "the image builds with something other than the README's Linux commands"

          if grep -nEi '^[[:space:]]*ADD[[:space:]]' client/Dockerfile; then fail "the Dockerfile uses ADD"; fi
          if grep -nEi '^[[:space:]]*COPY[[:space:]]+(--[^ ]+[[:space:]]+)*(\./?|client/?)[[:space:]]' client/Dockerfile; then
            fail "the Dockerfile copies a whole directory, so .env, out/ or state/ can reach a layer"
          fi

      - name: The README's apt line installs what the build needs
        run: |
          set -euo pipefail
          echo 'APT::Get::Assume-Yes "true";' | sudo tee /etc/apt/apt.conf.d/90-assume-yes > /dev/null
          sudo apt-get update -qq
          apt_line=$(grep -E '^sudo apt(-get)? install ' "$RUNNER_TEMP/linux-block.txt")
          bash -euo pipefail -c "$apt_line"

      - name: CMakeLists.txt names no SDK file, library, include path or runtime setting
        run: |
          set -euo pipefail
          test -s CMakeLists.txt
          if grep -nEi 'sdk/|include_directories|link_directories|tss2|crypto|\btbs\b|bcrypt|\.lib\b|\.a\b|MSVC_RUNTIME|/MD' CMakeLists.txt; then
            echo "::error::CMakeLists.txt names the SDK's internals"; exit 1
          fi

      - name: The client source names no TPM kind, container, key or RootHerald URL
        run: |
          set -euo pipefail
          ls main.c platform.h platform_linux.c platform_windows.c
          if grep -nEi 'swtpm|emulat|docker|container|TSS2_|/dev/tpm' ./*.c ./*.h; then
            echo "::error::the client source knows which TPM it reaches"; exit 1
          fi
          if grep -rnE 'rootherald\.io|https://|rh_sk_' .; then
            echo "::error::the client names RootHerald or a key"; exit 1
          fi

      - name: The preset configure and build, with every compiler and linker warning an error
        run: |
          set -euo pipefail
          cmake --preset linux -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_EXE_LINKER_FLAGS=-Wl,--fatal-warnings
          cmake --build --preset linux
          if strings out/build/linux/sandbox-client | grep -F rh_sk_; then echo "::error::the binary carries a key prefix"; exit 1; fi

      - name: The banner prints first, SANDBOX_URL is honoured, and an unreachable backend exits 1
        run: |
          set -uo pipefail
          set +e
          SANDBOX_URL=http://127.0.0.1:9 ./out/build/linux/sandbox-client > "$RUNNER_TEMP/smoke.out"
          code=$?
          set -e
          cat "$RUNNER_TEMP/smoke.out"
          test "$code" = 1 || { echo "::error::exit $code, expected 1"; exit 1; }
          grep -qxE 'RootHerald SDK: ABI 8\.1, library [^ ]+' <(sed -n 1p "$RUNNER_TEMP/smoke.out") || { echo "::error::first line is not the SDK banner"; exit 1; }
          if sed -n 1p "$RUNNER_TEMP/smoke.out" | grep -q 'library stub-'; then echo "::error::the client links the stub library"; exit 1; fi
          test "$(sed -n 2p "$RUNNER_TEMP/smoke.out")" = 'Backend: http://127.0.0.1:9'
          sed -n 3p "$RUNNER_TEMP/smoke.out" | grep -qxE 'State: .*/client/state'
          if grep -q '^stopped at ' "$RUNNER_TEMP/smoke.out"; then echo "::error::an unreachable backend is not a stop by the backend"; exit 1; fi

          set +e
          ./out/build/linux/sandbox-client > "$RUNNER_TEMP/default.out"
          set -e
          port=$(grep -oE 'SANDBOX_PORT:-[0-9]+' ../compose.yaml | head -n1 | cut -d- -f2)
          test "$(sed -n 2p "$RUNNER_TEMP/default.out")" = "Backend: http://127.0.0.1:$port" || { echo "::error::the default backend is not compose.yaml's port $port"; exit 1; }

      - name: The banner prints before RootHeraldOpen, and a stub library ends the run before it
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          # The link wraps two SDK exports: the library version can be made to
          # read stub-, and RootHeraldOpen logs its call and fails without a TPM.
          cat > "$RUNNER_TEMP/wrap.c" <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include "rootherald.h"

          const char* __real_RootHeraldLibraryVersion(void);

          const char* __wrap_RootHeraldLibraryVersion(void)
          {
              const char* version = getenv("WRAP_LIBRARY_VERSION");
              return version != NULL ? version : __real_RootHeraldLibraryVersion();
          }

          RH_STATUS __wrap_RootHeraldOpen(RH_HANDLE* handle)
          {
              FILE* log = fopen(getenv("WRAP_OPEN_LOG"), "a");
              if (log != NULL) {
                  fputs("RootHeraldOpen\n", log);
                  fclose(log);
              }
              *handle = NULL;
              return RH_ERR_TPM_UNAVAILABLE;
          }
          EOF
          gcc -c -I ../sdk/linux-x64/include -o "$RUNNER_TEMP/wrap.o" "$RUNNER_TEMP/wrap.c"
          # Applied after project(), so CMake's compiler probe links without the wrapper.
          cat > "$RUNNER_TEMP/wrap.cmake" <<EOF
          add_link_options(-Wl,--wrap=RootHeraldLibraryVersion -Wl,--wrap=RootHeraldOpen)
          link_libraries($RUNNER_TEMP/wrap.o)
          EOF
          cmake --preset linux -B out/build/wrapped -DCMAKE_PROJECT_INCLUDE="$RUNNER_TEMP/wrap.cmake"
          cmake --build out/build/wrapped
          export WRAP_OPEN_LOG="$RUNNER_TEMP/open.log"

          rm -f "$WRAP_OPEN_LOG"
          set +e
          WRAP_LIBRARY_VERSION=stub-0.7.0 SANDBOX_URL=http://127.0.0.1:9 ./out/build/wrapped/sandbox-client > "$RUNNER_TEMP/stub-library.out"
          code=$?
          set -e
          cat "$RUNNER_TEMP/stub-library.out"
          test "$code" = 1 || fail "stub library: exit $code, expected 1"
          test "$(sed -n 1p "$RUNNER_TEMP/stub-library.out")" = 'RootHerald SDK: ABI 8.1, library stub-0.7.0' || fail "stub library: the first line is not the banner"
          test "$(sed -n 2p "$RUNNER_TEMP/stub-library.out")" = 'Backend: http://127.0.0.1:9' || fail "stub library: the second line is not the backend"
          sed -n 3p "$RUNNER_TEMP/stub-library.out" | grep -qxE 'State: .*/client/state' || fail "stub library: the third line is not the state directory"
          test ! -e "$WRAP_OPEN_LOG" || fail "the stub library reached RootHeraldOpen"

          rm -f "$WRAP_OPEN_LOG"
          set +e
          SANDBOX_URL=http://127.0.0.1:9 ./out/build/wrapped/sandbox-client > "$RUNNER_TEMP/open-fails.out"
          code=$?
          set -e
          cat "$RUNNER_TEMP/open-fails.out"
          test "$code" = 1 || fail "RootHeraldOpen failing: exit $code, expected 1"
          test -s "$WRAP_OPEN_LOG" || fail "the wrapped RootHeraldOpen was not called"
          sed -n 1p "$RUNNER_TEMP/open-fails.out" | grep -qxE 'RootHerald SDK: ABI 8\.1, library [^ ]+' || fail "RootHeraldOpen failing: the first line is not the banner"
          test "$(sed -n 2p "$RUNNER_TEMP/open-fails.out")" = 'Backend: http://127.0.0.1:9' || fail "RootHeraldOpen failing: the second line is not the backend"
          sed -n 3p "$RUNNER_TEMP/open-fails.out" | grep -qxE 'State: .*/client/state' || fail "RootHeraldOpen failing: the third line is not the state directory"
          grep -q '^RootHeraldOpen failed: ' "$RUNNER_TEMP/open-fails.out" || fail "no RootHeraldOpen failure line"

      - name: The README describes no EK certificate line
        working-directory: .
        run: |
          if grep -niE 'EK cert' README.md; then echo "::error::README.md describes an EK certificate line the client does not print"; exit 1; fi

  client-linux-swtpm:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      STUB_PORT: "47999"
    steps:
      - uses: actions/checkout@v4

      - name: This runner has no TPM device, so the client's default TCTI chain lands on swtpm
        run: |
          if ls /dev/tpm* 2>/dev/null; then echo "::error::the runner has a TPM device"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake pkg-config libtss2-dev libssl-dev libcurl4-openssl-dev swtpm swtpm-tools tpm2-tools
          npm ci --prefix backend

      - name: Build the client
        working-directory: client
        run: |
          set -euo pipefail
          cmake --preset linux -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build --preset linux

      - name: Scenario helpers
        run: |
          cat > "$RUNNER_TEMP/scenario.sh" <<'EOF'
          set -euo pipefail
          T=$RUNNER_TEMP
          fail() { echo "::error::$*"; exit 1; }

          start_swtpm() {
            local dir=$1
            if [ ! -f "$dir/tpm2-00.permall" ]; then
              mkdir -p "$dir"
              swtpm_setup --create-config-files skip-if-exist > /dev/null
              swtpm_setup --tpm2 --tpmstate "$dir" --create-ek-cert > /dev/null
            fi
            swtpm socket --tpm2 --tpmstate "dir=$dir" --server type=tcp,port=2321 --ctrl type=tcp,port=2322 \
              --flags not-need-init,startup-clear --daemon --pid file=/tmp/rh-swtpm.pid
            for _ in $(seq 50); do
              tpm2_getcap -T swtpm:host=127.0.0.1,port=2321 properties-fixed > /dev/null 2>&1 && return 0
              sleep 0.2
            done
            fail "swtpm did not come up"
          }
          stop_swtpm() {
            kill "$(cat /tmp/rh-swtpm.pid)"
            while kill -0 "$(cat /tmp/rh-swtpm.pid)" 2>/dev/null; do sleep 0.1; done
          }

          start_stub() {
            SANDBOX_STUB_PORT=$STUB_PORT SANDBOX_STUB_STATE="$T/stub-state.json" node backend/stub-rootherald.js >> "$T/stub.log" 2>> "$T/stub-stderr.log" &
            echo $! > "$T/stub.pid"
            for _ in $(seq 50); do
              [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:$STUB_PORT/")" != 000 ] && return 0
              sleep 0.2
            done
            fail "the stub did not come up"
          }
          stop_stub() {
            kill -TERM "$(cat "$T/stub.pid")"
            while kill -0 "$(cat "$T/stub.pid")" 2>/dev/null; do sleep 0.1; done
          }

          # start_backend <policy> [port]
          start_backend() {
            local port=${2:-47823}
            ROOTHERALD_URL="http://127.0.0.1:$STUB_PORT" ROOTHERALD_SECRET_KEY="rh_sk_stub_$1" SANDBOX_PORT=$port \
              node backend/server.js >> "$T/backend.log" 2>&1 &
            echo $! > "$T/backend.pid"
            echo "$port" > "$T/backend.port"
            for _ in $(seq 50); do
              [ "$(curl -s -o /dev/null -w '%{http_code}' -H "Host: localhost:$port" "http://127.0.0.1:$port/")" = 200 ] && return 0
              sleep 0.2
            done
            fail "the backend did not come up"
          }
          stop_backend() {
            kill "$(cat "$T/backend.pid")"
            while kill -0 "$(cat "$T/backend.pid")" 2>/dev/null; do sleep 0.1; done
          }

          # run_client <name> [VAR=value ...] [-- client arguments]: output in $T/<name>.out, exit code in $T/<name>.code
          run_client() {
            local name=$1
            shift
            local vars=() args=()
            while [ $# -gt 0 ] && [ "$1" != -- ]; do vars+=("$1"); shift; done
            [ $# -gt 0 ] && shift
            args=("$@")
            set +e
            (cd client && env "${vars[@]}" timeout 120 ./out/build/linux/sandbox-client "${args[@]}") > "$T/$name.out" 2> "$T/$name.err"
            echo $? > "$T/$name.code"
            set -e
            echo "---- $name: exit $(cat "$T/$name.code")"
            cat "$T/$name.out"
          }
          code() { cat "$T/$1.code"; }
          routes() { grep -E '^  POST /' "$T/$1.out" | awk '{print $2}' | tr '\n' ' '; }
          stub_calls() { grep -c "^stub $1 " "$T/stub.log" || true; }
          events() { curl -sN --max-time 3 -H "Host: localhost:$1" "http://127.0.0.1:$1/events" || true; }
          last_ueid() { events "$1" | grep -o '"verdict":{[^}]*}' | grep -o '"ueid":"[^"]*"' | tail -n1 | cut -d'"' -f4; }
          fresh_state() { rm -rf client/state; }
          no_state_files() { [ -z "$(find client/state -type f 2>/dev/null)" ]; }
          EOF

      - name: The stub holds no hand-written TPM crypto; start swtpm and the stub
        run: |
          . "$RUNNER_TEMP/scenario.sh"
          if grep -nE 'createCipheriv|publicEncrypt|KDFa|node:crypto' backend/stub-rootherald.js; then fail "the stub does its own crypto"; fi
          start_swtpm /tmp/rh-swtpm-a
          start_stub

      - name: "C17 backend unreachable: PreCheck runs, exit 1, nothing written"
        run: |
          . "$RUNNER_TEMP/scenario.sh"
          fresh_state
          run_client unreachable SANDBOX_URL=http://127.0.0.1:9
          test "$(code unreachable)" = 1 || fail "exit $(code unreachable), expected 1"
          grep -qE '^Platform: ' "$T/unreachable.out" || fail "no PreCheck line"
          if grep -q '^stopped at ' "$T/unreachable.out"; then fail "an unreachable backend is not a stop by the backend"; fi
          no_state_files || fail "state/ holds $(find client/state -type f)"

      - name: "C11 refused enrollment: step 01's line, exit 2, nothing after, nothing written"
        run: |
          . "$RUNNER_TEMP/scenario.sh"
          fresh_state
          start_backend refuse
          run_client refuse
          stop_backend
          test "$(code refuse)" = 2 || fail "exit $(code refuse), expected 2"
          grep -qE '^  POST /enroll/begin  RootHerald refused: ek_chain_rejected' "$T/refuse.out" || fail "no refusal line"
          grep -qx 'stopped at /enroll/begin' "$T/refuse.out" || fail "no stopped line"
          if grep -E '^  POST /(attest|sign|decrypt)/' "$T/refuse.out"; then fail "a use case ran after the refusal"; fi
          no_state_files || fail "state/ holds $(find client/state -type f)"

      - name: "C11a enrollment refused at activation: stops at /enroll/complete, exit 2, nothing written"
        run: |
          . "$RUNNER_TEMP/scenario.sh"
          fresh_state
          start_backend refuse_activation
          run_client refuse-activation
          stop_backend
          test "$(code refuse-activation)" = 2 || fail "exit $(code refuse-activation), expected 2"
          grep -qx '  POST /enroll/begin  enrollment started' "$T/refuse-activation.out" || fail "enrollment did not start"
          grep -qx '  POST /enroll/complete  RootHerald refused: activation_refused' "$T/refuse-activation.out" || fail "no refusal line at /enroll/complete"
          grep -qx 'stopped at /enroll/complete' "$T/refuse-activation.out" || fail "no stopped line"
          if grep -E '^  POST /(attest|sign|decrypt)/' "$T/refuse-activation.out"; then fail "a use case ran after the refusal"; fi
          no_state_files || fail "state/ holds $(find client/state -type f)"

      - name: "C12 allowed, fresh state: all four use cases, the software TPM is never shown as silicon"
        run: |
          . "$RUNNER_TEMP/scenario.sh"
          fresh_state
          start_backend allow
          run_client allow
          last_ueid 47823 > "$T/ueid-a"
          stop_backend
          test "$(code allow)" = 0 || fail "exit $(code allow), expected 0"
          if grep -iE 'EK cert' "$T/allow.out"; then fail "the client reports an EK certificate on a software TPM"; fi
          expected="/enroll/begin /enroll/complete /attest/challenge /attest/verify /sign/challenge /sign/certify /sign/verify /decrypt/challenge /decrypt/certify /decrypt/verify "
          test "$(routes allow)" = "$expected" || fail "routes: $(routes allow)"
          grep -qE '^  POST /attest/verify  (pass|warn) — Software TPM, not genuine hardware, no maker vouches for this chip' "$T/allow.out" || fail "verify line"
          grep -qx '  POST /sign/certify  sign key certified, not hardware-bound' "$T/allow.out" || fail "sign certify line"
          grep -qx '  POST /decrypt/certify  decrypt key certified, not hardware-bound' "$T/allow.out" || fail "decrypt certify line"
          grep -qx '  POST /sign/verify  signature verified' "$T/allow.out" || fail "signature not verified"
          grep -qx '  POST /decrypt/verify  secret recovered' "$T/allow.out" || fail "secret not recovered"
          test "$(stat -c '%a' client/state)" = 700 || fail "state/ is mode $(stat -c '%a' client/state)"
          test "$(stat -c '%a' client/state/ak.blob)" = 600 || fail "ak.blob is mode $(stat -c '%a' client/state/ak.blob)"
          test "$(ls -A client/state)" = ak.blob || fail "state/ holds $(ls -A client/state)"
          test -n "$(cat "$T/ueid-a")" || fail "the backend's page shows no ueid"
          cp client/state/ak.blob "$T/ak-swtpm-a.blob"

      - name: "C12k every key the client loads, it closes before closing the session"
        run: |
          . "$RUNNER_TEMP/scenario.sh"
          # swtpm holds the AK, sign key and decrypt key at once, so a key left
          # loaded never runs the TPM out of slots here, and RootHeraldClose
          # closes any key still loaded. The link logs each of the three calls.
          cat > "$T/keys.c" <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include "rootherald.h"

          RH_STATUS __real_RootHeraldLoadKey(RH_HANDLE h, const uint8_t* keyBlob, size_t blobLen, RH_KEY_HANDLE* outKey);
          void __real_RootHeraldCloseKey(RH_KEY_HANDLE key);
          void __real_RootHeraldClose(RH_HANDLE h);

          static void LogCall(const char* name)
          {
              FILE* log = fopen(getenv("WRAP_KEY_LOG"), "a");
              if (log != NULL) {
                  fprintf(log, "%s\n", name);
                  fclose(log);
              }
          }

          RH_STATUS __wrap_RootHeraldLoadKey(RH_HANDLE h, const uint8_t* keyBlob, size_t blobLen, RH_KEY_HANDLE* outKey)
          {
              LogCall("RootHeraldLoadKey");
              return __real_RootHeraldLoadKey(h, keyBlob, blobLen, outKey);
          }

          void __wrap_RootHeraldCloseKey(RH_KEY_HANDLE key)
          {
              LogCall("RootHeraldCloseKey");
              __real_RootHeraldCloseKey(key);
          }

          void __wrap_RootHeraldClose(RH_HANDLE h)
          {
              LogCall("RootHeraldClose");
              __real_RootHeraldClose(h);
          }
          EOF
          gcc -c -I sdk/linux-x64/include -o "$T/keys.o" "$T/keys.c"
          cat > "$T/keys.cmake" <<EOF
          add_link_options(-Wl,--wrap=RootHeraldLoadKey -Wl,--wrap=RootHeraldCloseKey -Wl,--wrap=RootHeraldClose)
          link_libraries($T/keys.o)
          EOF
          (cd client && cmake --preset linux -B out/build/keys -DCMAKE_PROJECT_INCLUDE="$T/keys.cmake" && cmake --build out/build/keys)

          export WRAP_KEY_LOG="$T/keys.log"
          rm -f "$WRAP_KEY_LOG"
          start_backend allow
          set +e
          (cd client && timeout 120 ./out/build/keys/sandbox-client) > "$T/keys.out"
          code=$?
          set -e
          stop_backend
          cat "$T/keys.out"
          cat "$WRAP_KEY_LOG"
          test "$code" = 0 || fail "exit $code, expected 0"
          grep -qx '  POST /sign/verify  signature verified' "$T/keys.out" || fail "signature not verified"
          grep -qx '  POST /decrypt/verify  secret recovered' "$T/keys.out" || fail "secret not recovered"
          grep -qx RootHeraldClose "$WRAP_KEY_LOG" || fail "the session was never closed"
          sed '/^RootHeraldClose$/q' "$WRAP_KEY_LOG" > "$T/keys-before-close.log"
          loads=$(grep -cx RootHeraldLoadKey "$T/keys-before-close.log" || true)
          closes=$(grep -cx RootHeraldCloseKey "$T/keys-before-close.log" || true)
          test "$loads" = 2 || fail "RootHeraldLoadKey called $loads times, expected 2"
          test "$closes" = 2 || fail "RootHeraldCloseKey called $closes times before RootHeraldClose, for $loads loads"

      - name: "C13 second run on another port: enrollment skipped, same ueid"
        run: |
          . "$RUNNER_TEMP/scenario.sh"
          enrolls=$(stub_calls /api/v1/attest/enroll)
          start_backend allow 48111
          run_client second SANDBOX_URL=http://127.0.0.1:48111
          last_ueid 48111 > "$T/ueid-second"
          stop_backend
          test "$(code second)" = 0 || fail "exit $(code second), expected 0"
          grep -qx 'Enrollment skipped: state/ak.blob loads' "$T/second.out" || fail "enrollment not skipped"
          if grep -E '^  POST /enroll/' "$T/second.out"; then fail "the second run enrolled"; fi
          test "$(stub_calls /api/v1/attest/enroll)" = "$enrolls" || fail "the stub saw an enrollment"
          test "$(cat "$T/ueid-second")" = "$(cat "$T/ueid-a")" || fail "ueid $(cat "$T/ueid-second") is not run 1's $(cat "$T/ueid-a")"

      - name: "C14 blocked, stub restarted from its state: stops at verify, exit 2, ak.blob kept"
        run: |
          . "$RUNNER_TEMP/scenario.sh"
          stop_stub
          start_stub
          cp client/state/ak.blob "$T/ak-before-block.blob"
          start_backend block
          run_client block
          stop_backend
          test "$(code block)" = 2 || fail "exit $(code block), expected 2"
          grep -q '^Enrollment skipped' "$T/block.out" || fail "enrollment not skipped"
          grep -qE '^  POST /attest/verify  blocked — ' "$T/block.out" || fail "no blocked line"
          grep -qx 'stopped at /attest/verify' "$T/block.out" || fail "no stopped line"
          if grep -E '^  POST /(enroll|sign|decrypt)/' "$T/block.out"; then fail "the run went past the blocked verdict"; fi
          cmp client/state/ak.blob "$T/ak-before-block.blob" || fail "ak.blob changed"

      - name: "C15 the stub forgot the device: one 409, re-enroll once, then all four use cases"
        run: |
          . "$RUNNER_TEMP/scenario.sh"
          stop_stub
          rm -f "$T/stub-state.json"
          start_stub
          start_backend allow
          run_client forgotten
          stop_backend
          test "$(code forgotten)" = 0 || fail "exit $(code forgotten), expected 0"
          expected="/attest/challenge /attest/verify /enroll/begin /enroll/complete /attest/challenge /attest/verify /sign/challenge /sign/certify /sign/verify /decrypt/challenge /decrypt/certify /decrypt/verify "
          test "$(routes forgotten)" = "$expected" || fail "routes: $(routes forgotten)"
          test "$(grep -E '^  POST /attest/verify  ' "$T/forgotten.out" | head -n1)" = '  POST /attest/verify  not enrolled' || fail "the first verify is not the 409"
          grep -qE '^  POST /attest/verify  (pass|warn) — ' "$T/forgotten.out" || fail "the retry did not pass"

      - name: "C15d the stub forgot the device and refuses it again: the 409 deletes ak.blob"
        run: |
          . "$RUNNER_TEMP/scenario.sh"
          test -e client/state/ak.blob || fail "no ak.blob to start from"
          stop_stub
          rm -f "$T/stub-state.json"
          start_stub
          start_backend refuse
          run_client forgotten-refused
          stop_backend
          test "$(code forgotten-refused)" = 2 || fail "exit $(code forgotten-refused), expected 2"
          test "$(routes forgotten-refused)" = "/attest/challenge /attest/verify /enroll/begin " || fail "routes: $(routes forgotten-refused)"
          grep -qx '  POST /attest/verify  not enrolled' "$T/forgotten-refused.out" || fail "the verify is not the 409"
          grep -qx 'stopped at /enroll/begin' "$T/forgotten-refused.out" || fail "no stopped line"
          test ! -e client/state/ak.blob || fail "ak.blob outlived the 409"

      - name: "C15n always unenrolled: two 409s and a stop, never a loop"
        run: |
          . "$RUNNER_TEMP/scenario.sh"
          fresh_state
          start_backend unenrolled
          run_client unenrolled
          stop_backend
          test "$(code unenrolled)" = 2 || fail "exit $(code unenrolled), expected 2 (124 is a timeout)"
          test "$(grep -c '^  POST /attest/verify  not enrolled$' "$T/unenrolled.out")" = 2 || fail "not exactly two 409s"
          test "$(grep -c '^  POST /attest/verify  ' "$T/unenrolled.out")" = 2 || fail "more than two verify lines"
          grep -qx 'stopped at /attest/verify' "$T/unenrolled.out" || fail "no stopped line"

      - name: "C16 TPM cleared: the old ak.blob no longer loads, the client enrolls again as a new device"
        run: |
          . "$RUNNER_TEMP/scenario.sh"
          stop_swtpm
          start_swtpm /tmp/rh-swtpm-b
          fresh_state
          install -d -m 700 client/state
          install -m 600 "$T/ak-swtpm-a.blob" client/state/ak.blob
          start_backend allow
          run_client cleared
          last_ueid 47823 > "$T/ueid-b"
          stop_backend
          test "$(code cleared)" = 0 || fail "exit $(code cleared), expected 0"
          if grep -q '^Enrollment skipped' "$T/cleared.out"; then fail "a dead ak.blob was taken as loading"; fi
          grep -qE '^  POST /enroll/begin  ' "$T/cleared.out" || fail "no enrollment"
          test -n "$(cat "$T/ueid-b")" || fail "the backend's page shows no ueid"
          test "$(cat "$T/ueid-b")" != "$(cat "$T/ueid-a")" || fail "a new TPM kept the old ueid"

      - name: "C18 --complete-enrollment with nothing to complete: no HTTP, no ak.blob, non-zero exit"
        run: |
          . "$RUNNER_TEMP/scenario.sh"
          fresh_state
          start_backend allow
          calls=$(grep -c '^stub /' "$T/stub.log")
          before=$(events 47823 | grep -c '^data:' || true)
          run_client elevated -- --complete-enrollment
          after=$(events 47823 | grep -c '^data:' || true)
          stop_backend
          test "$(code elevated)" != 0 || fail "exit 0 with nothing to complete"
          test "$(grep -c '^stub /' "$T/stub.log")" = "$calls" || fail "the stub saw a request"
          test "$after" = "$before" || fail "the backend saw a request"
          test ! -e client/state/ak.blob || fail "ak.blob written"

      - name: "C19 no ueid or deviceId reaches the client's output"
        run: |
          . "$RUNNER_TEMP/scenario.sh"
          ids=$(sed -n 's/^stub deviceId //p' "$T/stub.log" | sort -u)
          test -n "$ids" || fail "the stub issued no deviceId"
          for id in $ids; do
            for form in "$id" "${id//-/}"; do
              hits=$(cat "$T"/*.out "$T"/*.err | grep -ciF "$form" || true)
              test "$hits" = 0 || fail "client output carries $form"
            done
          done

      - name: "No run prints an EK certificate line: the device's own read is not a verdict"
        run: |
          . "$RUNNER_TEMP/scenario.sh"
          test -s "$T/allow.out" || fail "no output from the allowed run"
          if grep -niE 'EK cert' "$T"/*.out; then fail "the client reports an EK certificate"; fi

      - name: Logs
        if: always()
        run: |
          for f in stub.log stub-stderr.log backend.log; do echo "==== $f"; cat "$RUNNER_TEMP/$f" 2>/dev/null || true; done

  client-swtpm:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      STUB_PORT: "47999"
    steps:
      - uses: actions/checkout@v4

      - name: The README's container commands are the ones this job runs
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          awk '/^#+ Run the client in a container[[:space:]]*$/ { heading = 1; next }
               heading && !fence && /^#/ { exit }
               heading { print }
               heading && /^```/ { fence = !fence }' README.md | tr -d '\r' > "$RUNNER_TEMP/container-section.txt"
          cat "$RUNNER_TEMP/container-section.txt"
          awk '/^```/ { fence = !fence; next } fence' "$RUNNER_TEMP/container-section.txt" | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/container-block.txt"
          printf '%s\n' 'docker compose up -d' 'docker compose run --rm client' > "$RUNNER_TEMP/container-expected.txt"
          diff "$RUNNER_TEMP/container-expected.txt" "$RUNNER_TEMP/container-block.txt" || fail "README.md has no 'Run the client in a container' block with the two commands"
          grep -qF 'docker compose --profile client down -v' "$RUNNER_TEMP/container-section.txt" \
            || fail "the container section does not say docker compose --profile client down -v makes a new device"

      - name: "C20 the client service: the backend's loopback, no key, no fixed name, the sandbox's own volumes"
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          canary="rh_sk_c20canary$(openssl rand -hex 8)"
          printf 'ROOTHERALD_SECRET_KEY=%s\n' "$canary" > .env
          docker compose --profile client config --format json > "$RUNNER_TEMP/client.json"
          jq '.services.client' "$RUNNER_TEMP/client.json"
          jq -e '.services.client' "$RUNNER_TEMP/client.json" > /dev/null || fail "compose.yaml has no client service"
          jq -e '.services.client.profiles == ["client"]' "$RUNNER_TEMP/client.json" || fail "the client is not behind profiles: [client]"
          if docker compose config --services | grep -qx client; then fail "a bare docker compose config lists the client"; fi
          jq -e '.services.client.network_mode == "service:backend"' "$RUNNER_TEMP/client.json" || fail "the client does not share the backend's loopback"
          jq -e '.services.client | has("env_file") | not' "$RUNNER_TEMP/client.json" || fail "the client reads an env_file"
          jq -e '.services.client | has("container_name") | not' "$RUNNER_TEMP/client.json" || fail "the client has a fixed container name"
          jq -e '(.services.client.environment // {}) | has("ROOTHERALD_SECRET_KEY") | not' "$RUNNER_TEMP/client.json" || fail "the client is given the key"
          if jq -c '.services.client' "$RUNNER_TEMP/client.json" | grep -qF "$canary"; then fail "the client's configuration carries the key"; fi
          jq -e '.services.client.environment.SANDBOX_URL == "http://127.0.0.1:47823"' "$RUNNER_TEMP/client.json" || fail "the client's default backend is not the backend's default port"
          jq -e '.services.client.environment.TSS2_LOG == "all+none"' "$RUNNER_TEMP/client.json" || fail "the client does not set TSS2_LOG=all+none"
          jq -e '.services.client.environment | has("TSS2_TCTI") | not' "$RUNNER_TEMP/client.json" || fail "the client sets TSS2_TCTI, which the SDK's default transport chain ignores"
          printf 'SANDBOX_PORT=48111\n' >> .env
          docker compose --profile client config --format json \
            | jq -e '.services.client.environment.SANDBOX_URL == "http://127.0.0.1:48111"' || fail "the client does not follow SANDBOX_PORT in .env"
          jq -e '[.services.client.volumes[]? | select(.type == "volume" and .target == "/sandbox/client/state")] | length == 1' "$RUNNER_TEMP/client.json" \
            || fail "client/state is not a named volume"
          jq -e '(.volumes | keys) == ["client-state", "swtpm"]' "$RUNNER_TEMP/client.json" || fail "the volumes are not swtpm and client-state"
          jq -e '[.volumes[] | (.external // false) == false and (.name | startswith("rootherald-sandbox_"))] | all' "$RUNNER_TEMP/client.json" \
            || fail "a volume is not the sandbox's own"
          rm .env

      - name: Container helpers
        run: |
          cat > "$RUNNER_TEMP/container.sh" <<'EOF'
          set -euo pipefail
          T=$RUNNER_TEMP
          STATE_VOLUME=rootherald-sandbox_client-state
          fail() { echo "::error::$*"; exit 1; }

          # The stub runs in the backend's network namespace, where the backend
          # and the client reach it on loopback; it lives as long as that backend.
          start_stub() {
            local ready
            touch "$T/stub.log"
            ready=$(grep -c '^stub ready' "$T/stub.log" || true)
            docker run -d --name rh-stub --network "container:$(docker compose ps -q backend)" \
              -v "$PWD/backend:/stub:ro" -v "$T:/t" \
              -e SANDBOX_STUB_PORT="$STUB_PORT" -e SANDBOX_STUB_STATE=/t/stub-state.json \
              rh-stub sh -c 'exec node /stub/stub-rootherald.js >> /t/stub.log 2>> /t/stub-stderr.log' > /dev/null
            for _ in $(seq 50); do
              [ "$(grep -c '^stub ready' "$T/stub.log" || true)" -gt "$ready" ] && return 0
              sleep 0.2
            done
            fail "the stub did not come up"
          }
          stop_stub() { docker rm -f rh-stub > /dev/null 2>&1 || true; }

          # use_backend <policy> [port]: the README's `docker compose up -d`, on
          # a .env holding the stub's key for that policy.
          use_backend() {
            local port=${2:-47823}
            stop_stub
            printf 'ROOTHERALD_SECRET_KEY=rh_sk_stub_%s\nSANDBOX_PORT=%s\nROOTHERALD_URL=http://127.0.0.1:%s\n' "$1" "$port" "$STUB_PORT" > .env
            docker compose up -d 2>> "$T/compose.log"
            for _ in $(seq 100); do
              [ "$(curl -s -o /dev/null -w '%{http_code}' -H "Host: localhost:$port" "http://127.0.0.1:$port/")" = 200 ] && break
              sleep 0.2
            done
            [ "$(curl -s -o /dev/null -w '%{http_code}' -H "Host: localhost:$port" "http://127.0.0.1:$port/")" = 200 ] || fail "the backend did not come up"
            start_stub
          }

          # run_client <name>: the README's `docker compose run --rm client`;
          # output in $T/c-<name>.out and .err, exit code in $T/c-<name>.code
          run_client() {
            set +e
            timeout 300 docker compose run --rm client > "$T/c-$1.out" 2> "$T/c-$1.err"
            echo $? > "$T/c-$1.code"
            set -e
            echo "---- $1: exit $(cat "$T/c-$1.code")"
            cat "$T/c-$1.out"
          }
          code() { cat "$T/c-$1.code"; }
          routes() { grep -E '^  POST /' "$T/c-$1.out" | awk '{print $2}' | tr '\n' ' '; }
          stub_calls() { grep -c "^stub $1 " "$T/stub.log" || true; }
          events() { curl -sN --max-time 3 -H "Host: localhost:$1" "http://127.0.0.1:$1/events" || true; }
          last_ueid() { events "$1" | grep -o '"verdict":{[^}]*}' | grep -o '"ueid":"[^"]*"' | tail -n1 | cut -d'"' -f4; }
          in_state() {
            docker volume inspect "$STATE_VOLUME" > /dev/null 2>&1 || return 0
            docker run --rm -v "$STATE_VOLUME:/state" busybox sh -c "$1"
          }
          state_files() { in_state 'cd /state && find . -type f | sort'; }
          fresh_state() { in_state 'rm -rf /state/* /state/.[!.]*'; }
          EOF

      - name: Build the stub's image and the client's image
        run: |
          . "$RUNNER_TEMP/container.sh"
          docker build -q -t rh-stub - <<'DOCKERFILE'
          FROM node:22-bookworm-slim
          RUN apt-get update -qq && apt-get install -y -qq tpm2-tools && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          if grep -nE 'createCipheriv|publicEncrypt|KDFa|node:crypto' backend/stub-rootherald.js; then fail "the stub does its own crypto"; fi

      - name: "C22 the client image holds no key, .env, build output or state from the checkout"
        run: |
          . "$RUNNER_TEMP/container.sh"
          canary="rh_sk_cicanary$(openssl rand -hex 16)"
          echo "::add-mask::$canary"
          printf 'ROOTHERALD_SECRET_KEY=%s\n' "$canary" > .env
          grep -qF "$canary" .env || fail "no canary in .env"
          mkdir -p client/out client/state
          echo "$canary" > client/out/host-build-marker
          echo "$canary" > client/state/host-state-marker
          docker compose --profile client build client
          img=$(docker compose --profile client config --format json | jq -r '.services.client.image // (.name + "-client")')
          docker image inspect "$img" > /dev/null || fail "no client image $img"
          hits=$(docker save "$img" | grep -caF "$canary" || true)
          test "$hits" = 0 || fail "the client image carries the canary"
          if docker history --no-trunc "$img" | grep -qF "$canary"; then fail "the client image's history carries the canary"; fi
          found=$(docker run --rm --entrypoint sh "$img" -c 'find / -xdev \( -name .env -o -name "host-*-marker" \) 2>/dev/null')
          test -z "$found" || fail "the client image holds $found"
          rm -rf .env client/out client/state

      - name: "C23 a bare up starts no client"
        run: |
          . "$RUNNER_TEMP/container.sh"
          # C22 built the client image; set it aside so a build by this up shows.
          docker image tag rootherald-sandbox-client rh-c22-client
          docker image rm rootherald-sandbox-client > /dev/null
          use_backend allow
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=rootherald-sandbox --filter label=com.docker.compose.service=client)" \
            || fail "docker compose up started the client"
          docker compose ps -a
          if docker image inspect rootherald-sandbox-client > /dev/null 2>&1; then fail "docker compose up built the client image"; fi
          for volume in rootherald-sandbox_swtpm rootherald-sandbox_client-state; do
            if docker volume inspect "$volume" > /dev/null 2>&1; then fail "docker compose up created the $volume volume"; fi
          done
          docker image tag rh-c22-client rootherald-sandbox-client

      - name: "C23 C11 refused enrollment in the container: step 01's line, exit 2, nothing after, nothing written"
        run: |
          . "$RUNNER_TEMP/container.sh"
          fresh_state
          use_backend refuse
          run_client refuse
          test "$(code refuse)" = 2 || fail "exit $(code refuse), expected 2"
          grep -qE '^  POST /enroll/begin  RootHerald refused: ek_chain_rejected' "$T/c-refuse.out" || fail "no refusal line"
          grep -qx 'stopped at /enroll/begin' "$T/c-refuse.out" || fail "no stopped line"
          if grep -E '^  POST /(attest|sign|decrypt)/' "$T/c-refuse.out"; then fail "a use case ran after the refusal"; fi
          test -z "$(state_files)" || fail "state/ holds $(state_files)"

      - name: "C23 C12 allowed in the container: swtpm said first, all four use cases, never shown as silicon"
        run: |
          . "$RUNNER_TEMP/container.sh"
          fresh_state
          use_backend allow
          run_client allow
          last_ueid 47823 > "$T/c-ueid-a"
          test "$(code allow)" = 0 || fail "exit $(code allow), expected 0"
          swtpm_line=$(grep -nx 'Software TPM: swtpm in this container' "$T/c-allow.out" | head -n1 | cut -d: -f1)
          banner_line=$(grep -nE '^RootHerald SDK: ABI 8\.1, library ' "$T/c-allow.out" | head -n1 | cut -d: -f1)
          test -n "$swtpm_line" || fail "the container does not say it runs swtpm"
          test -n "$banner_line" || fail "no SDK banner"
          test "$swtpm_line" -lt "$banner_line" || fail "the swtpm line comes after the banner"
          expected="/enroll/begin /enroll/complete /attest/challenge /attest/verify /sign/challenge /sign/certify /sign/verify /decrypt/challenge /decrypt/certify /decrypt/verify "
          test "$(routes allow)" = "$expected" || fail "routes: $(routes allow)"
          grep -qE '^  POST /attest/verify  (pass|warn) — Software TPM, not genuine hardware, no maker vouches for this chip' "$T/c-allow.out" || fail "verify line"
          grep -qx '  POST /sign/certify  sign key certified, not hardware-bound' "$T/c-allow.out" || fail "sign certify line"
          grep -qx '  POST /decrypt/certify  decrypt key certified, not hardware-bound' "$T/c-allow.out" || fail "decrypt certify line"
          grep -qx '  POST /sign/verify  signature verified' "$T/c-allow.out" || fail "signature not verified"
          grep -qx '  POST /decrypt/verify  secret recovered' "$T/c-allow.out" || fail "secret not recovered"
          test "$(state_files)" = ./ak.blob || fail "state/ holds $(state_files)"
          test "$(in_state 'stat -c %a /state/ak.blob')" = 600 || fail "ak.blob is mode $(in_state 'stat -c %a /state/ak.blob')"
          test -n "$(cat "$T/c-ueid-a")" || fail "the backend's page shows no ueid"

      - name: "C23 C13 second run, port changed in .env only: enrollment skipped, same ueid"
        run: |
          . "$RUNNER_TEMP/container.sh"
          enrolls=$(stub_calls /api/v1/attest/enroll)
          use_backend allow 48111
          run_client second
          last_ueid 48111 > "$T/c-ueid-second"
          test "$(code second)" = 0 || fail "exit $(code second), expected 0"
          grep -qx 'Enrollment skipped: state/ak.blob loads' "$T/c-second.out" || fail "enrollment not skipped"
          if grep -E '^  POST /enroll/' "$T/c-second.out"; then fail "the second run enrolled"; fi
          test "$(stub_calls /api/v1/attest/enroll)" = "$enrolls" || fail "the stub saw an enrollment"
          test "$(cat "$T/c-ueid-second")" = "$(cat "$T/c-ueid-a")" || fail "ueid $(cat "$T/c-ueid-second") is not run 1's $(cat "$T/c-ueid-a")"

      - name: "C23 C14 blocked in the container, stub restarted from its state: stops at verify, exit 2, ak.blob kept"
        run: |
          . "$RUNNER_TEMP/container.sh"
          before=$(in_state 'sha256sum /state/ak.blob')
          use_backend block
          run_client block
          test "$(code block)" = 2 || fail "exit $(code block), expected 2"
          grep -q '^Enrollment skipped' "$T/c-block.out" || fail "enrollment not skipped"
          grep -qE '^  POST /attest/verify  blocked — ' "$T/c-block.out" || fail "no blocked line"
          grep -qx 'stopped at /attest/verify' "$T/c-block.out" || fail "no stopped line"
          if grep -E '^  POST /(enroll|sign|decrypt)/' "$T/c-block.out"; then fail "the run went past the blocked verdict"; fi
          test "$(in_state 'sha256sum /state/ak.blob')" = "$before" || fail "ak.blob changed"

      - name: "C23 C15 the stub forgot the device: one 409, re-enroll once, then all four use cases"
        run: |
          . "$RUNNER_TEMP/container.sh"
          stop_stub
          rm -f "$T/stub-state.json"
          use_backend allow
          run_client forgotten
          last_ueid 47823 > "$T/c-ueid-forgotten"
          test "$(code forgotten)" = 0 || fail "exit $(code forgotten), expected 0"
          expected="/attest/challenge /attest/verify /enroll/begin /enroll/complete /attest/challenge /attest/verify /sign/challenge /sign/certify /sign/verify /decrypt/challenge /decrypt/certify /decrypt/verify "
          test "$(routes forgotten)" = "$expected" || fail "routes: $(routes forgotten)"
          test "$(grep -E '^  POST /attest/verify  ' "$T/c-forgotten.out" | head -n1)" = '  POST /attest/verify  not enrolled' || fail "the first verify is not the 409"
          grep -qE '^  POST /attest/verify  (pass|warn) — ' "$T/c-forgotten.out" || fail "the retry did not pass"
          test "$(cat "$T/c-ueid-forgotten")" = "$(cat "$T/c-ueid-a")" || fail "the same swtpm came back as another device"

      - name: "C23 C19 no ueid or deviceId reaches the container's output, and tctildr logs no errors"
        run: |
          . "$RUNNER_TEMP/container.sh"
          ids=$(sed -n 's/^stub deviceId //p' "$T/stub.log" | sort -u)
          test -n "$ids" || fail "the stub issued no deviceId"
          for id in $ids; do
            for form in "$id" "${id//-/}"; do
              hits=$(cat "$T"/c-*.out "$T"/c-*.err | grep -ciF "$form" || true)
              test "$hits" = 0 || fail "client output carries $form"
            done
          done
          if grep -n 'ERROR:' "$T"/c-*.out "$T"/c-*.err; then fail "the container's output carries TCTI errors"; fi

      - name: "C24 the README's --profile client down -v removes the device and nothing foreign; the next run is a new device"
        run: |
          . "$RUNNER_TEMP/container.sh"
          docker volume create sentinel-vol > /dev/null
          stop_stub
          docker compose --profile client down -v
          left=$(docker volume ls -q | grep '^rootherald-sandbox_' || true)
          test -z "$left" || fail "down -v left $left"
          docker volume inspect sentinel-vol > /dev/null || fail "down -v removed a volume it did not create"
          rm -f "$T/stub-state.json"
          use_backend allow
          run_client new-device
          last_ueid 47823 > "$T/c-ueid-new"
          test "$(code new-device)" = 0 || fail "exit $(code new-device), expected 0"
          if grep -q '^Enrollment skipped' "$T/c-new-device.out"; then fail "the device survived down -v"; fi
          grep -qE '^  POST /enroll/begin  ' "$T/c-new-device.out" || fail "no enrollment"
          test -n "$(cat "$T/c-ueid-new")" || fail "the backend's page shows no ueid"
          test "$(cat "$T/c-ueid-new")" != "$(cat "$T/c-ueid-a")" || fail "down -v kept the old ueid"
          stop_stub
          docker compose --profile client down -v

      - name: "C26 six runs on one swtpm volume: each passes as the same device, never TPM_RC_LOCKOUT"
        run: |
          . "$RUNNER_TEMP/container.sh"
          stop_stub
          docker compose --profile client down -v
          rm -f "$T/stub-state.json"
          use_backend allow
          for i in 1 2 3 4 5 6; do
            run_client "six-$i"
            last_ueid 47823 > "$T/c-ueid-six-$i"
            if grep -nE 'TPM_RC_LOCKOUT|0x0*921' "$T/c-six-$i.out" "$T/c-six-$i.err"; then fail "run $i hit TPM_RC_LOCKOUT"; fi
            test "$(code "six-$i")" = 0 || fail "run $i exit $(code "six-$i"), expected 0"
            grep -qE '^  POST /attest/verify  (pass|warn) — ' "$T/c-six-$i.out" || fail "run $i did not pass"
            test "$(cat "$T/c-ueid-six-$i")" = "$(cat "$T/c-ueid-six-1")" || fail "run $i came back as another device"
          done
          stop_stub
          docker compose --profile client down -v

      - name: "C25 a CRLF checkout builds and runs the container"
        run: |
          . "$RUNNER_TEMP/container.sh"
          git -c core.autocrlf=true worktree add --detach "$T/crlf" HEAD
          cd "$T/crlf"
          file client/Dockerfile compose.yaml
          file client/Dockerfile | grep -q CRLF || fail "the checkout is not CRLF"
          file compose.yaml | grep -q CRLF || fail "compose.yaml is not CRLF"
          docker compose --profile client build client
          use_backend allow
          run_client crlf
          test "$(code crlf)" = 0 || fail "exit $(code crlf), expected 0"
          grep -qx 'Software TPM: swtpm in this container' "$T/c-crlf.out" || fail "the container does not say it runs swtpm"
          grep -qE '^  POST /attest/verify  (pass|warn) — Software TPM, not genuine hardware' "$T/c-crlf.out" || fail "verify line"
          grep -qx '  POST /decrypt/verify  secret recovered' "$T/c-crlf.out" || fail "secret not recovered"
          if grep -n $'\r' "$T/c-crlf.out"; then fail "the output carries carriage returns"; fi
          stop_stub
          docker compose --profile client down -v

      - name: Logs
        if: always()
        run: |
          for f in stub.log stub-stderr.log compose.log; do echo "==== $f"; cat "$RUNNER_TEMP/$f" 2>/dev/null || true; done
          for f in "$RUNNER_TEMP"/c-*.err; do echo "==== $f"; cat "$f"; done 2>/dev/null || true
          docker compose logs backend 2>/dev/null || true
